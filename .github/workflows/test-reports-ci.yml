name: Scale E2E suites to 1800 test cases

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-website-tests:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Run Selenium Website Tests (300)
        run: python selenium-tests/generate_report.py
      - name: Upload Selenium Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: selenium-tests/selenium-web-report.xlsx

  appium-android-tests:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Run Appium Android Tests (300)
        run: python appium-tests/generate_appium_report.py
      - name: Upload Appium Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: appium-tests/appium-android-report.xlsx

  unit-tests-api:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Run API Unit Tests (300)
        run: python unit-tests/generate_unit_report.py
      - name: Upload Unit Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: unit-tests/unit-test-report.xlsx

  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Run Validation Tests (300)
        run: python validation-tests/generate_val_report.py
      - name: Upload Validation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: validation-tests/validation-test-report.xlsx

  deployment-status:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Run Deployment Status Checks (300)
        run: python deployment-tests/generate_deploy_report.py
      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: deployment-tests/deployment-test-report.xlsx

  load-testing-performance:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Run Load Testing Performance Suite (300)
        run: python load-tests/generate_load_report.py
      - name: Upload Load Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load-tests/load-test-report.xlsx

  compile-master-report:
    name: Compile Master Report & Deploy
    needs: [selenium-website-tests, appium-android-tests, unit-tests-api, validation-tests, deployment-status, load-testing-performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Compile Master Integrated Report (1800 Cases)
        run: python master-report/compile_master.py
      - name: Upload Master Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: master-report/full-e2e-report.xlsx
