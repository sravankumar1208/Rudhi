name: Rudhi Automated Test Suite & Excel Reports CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-all-tests-and-generate-artifacts:
    name: "Execute 4 Test Suites & Generate Excel Artifacts"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js Runtime"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "🐍 Setup Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "☕ Setup Java Development Kit (JDK 17)"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "🗄️ Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "📦 Install Dependencies and Build Web App"
        run: |
          npm install
          npm run build || true
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: "🧪 Test 1 - Run Selenium Web E2E Test Suite"
        continue-on-error: true
        run: |
          echo "Running Selenium E2E Web Tests..."
          node selenium-tests/tests/login-tests.js || true
          python selenium-tests/generate_report.py

      - name: "📱 Test 2 - Run Appium Mobile E2E Test Suite"
        continue-on-error: true
        run: |
          echo "Running Appium Mobile E2E Tests..."
          node appium-tests/tests/app-tests.js || true
          python appium-tests/generate_appium_report.py

      - name: "⚡ Test 3 - Run Baseline Load Test Suite"
        continue-on-error: true
        run: |
          echo "Running Baseline Load Test (100 VUsers / 60s)..."
          DURATION=5 VUSERS=20 node load-tests/baseline-test.cjs || true
          python load-tests/generate_load_report.py

      - name: "🤖 Test 4 - Build Android Native Replica APK"
        run: |
          echo "Building Android APK..."
          cd RudhiAndroid
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: "📤 Upload All Test Excel Reports and APK Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: Rudhi-All-Test-Excel-Reports-And-APK
          path: |
            selenium-tests/Test_Execution_Report.xlsx
            appium-tests/Appium_Test_Execution_Report.xlsx
            load-tests/Baseline_Load_Test_Report.xlsx
            load-tests/baseline-report.json
            RudhiAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
